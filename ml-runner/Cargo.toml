[package]
name = "ml-runner"
version = "0.1.0"
authors = ["jamesharden122 <loudonvillewf@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
dioxus = { version = "0.6.3", features = ["router", "fullstack"] }
surrealdb = { version = "2.3.7", optional = true }
axum = { version = "0.7", optional = true }
tower-http = { version = "0.6.6", features = ["cors"], optional = true }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros"], optional = true }
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
polars = { version = "0.51", default-features = false, features = [
  "lazy",
  "csv",
  "temporal",           # Duration/Date/Datetime
  "dtype-date",
  "dtype-datetime",
  "dtype-duration",
  "rolling_window",     # fixed-size windows
  "rolling_window_by",  # time-based windows (…_by)
  "fmt_no_tty",
  "abs",
  "cum_agg",
] }
ml_backend = { package = "bento_queries", path = "../../bento_queries", optional = true }
wrds_io = {package = "words_db", path = "../../words_db", optional = true}
pyo3-polars = "0.24.0"
pyo3 = "0.25.1"
serde_json = "1.0.143"
dioxus-cli-config = { version = "0.6.0", optional = true }
reqwest = { version = "0.11", features = ["json"] }
dioxus-logger = "0.6.2"
surrealml-core = {path = "../surrealml-core-patched", optional = true  }
ndarray = "0.16"
ort = { version = "2.0.0-rc.9", features = ["ndarray", "cuda"], optional = true }
ort-candle = { version = "0.1.0+0.8", optional = true }
dynosaur = "0.3.0"
chrono = "0.4.42"
futures = "0.3.31"
#duckdb = { version = "1.4.1", optional = true }-=


[features]
default = ["server"]
web = ["dioxus/web"]
server = [
    "dioxus/server",
    "dep:surrealdb",
    "dep:ml_backend",
    "dep:axum",
    "dep:tokio",
    "dep:dioxus-cli-config",
    "dep:surrealml-core",
    "dep:ort",
    "dep:ort-candle",
    "dep:tower-http",
    "dep:wrds_io",
    #"dep:duckdb",
]

desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[dev-dependencies]
tokio = { version = "1.37", features = ["rt-multi-thread", "macros"] }
ml_backend = { package = "bento_queries", path = "../../bento_queries" }
