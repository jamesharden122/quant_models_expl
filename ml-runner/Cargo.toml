[package]
name = "ml-runner"
version = "0.1.0"
authors = ["jamesharden122 <loudonvillewf@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
dioxus = { version = "0.6.3", features = ["router", "fullstack"] }
surrealdb = { version = "2.3.7", optional = true }
axum = { version = "0.7", optional = true }
tower-http = { version = "0.6.6", features = ["cors"], optional = true }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros"], optional = true }
serde = { version = "1", features = ["derive"] }
polars = { version = "0.52.0", features = ["lazy", "temporal", "dtype-date", "dtype-datetime", "dtype-duration", "fmt_no_tty", "abs", "cum_agg", "timezones", "dtype-u128", "dtype-i128", "dtype-u8", "rolling_window", "rolling_window_by","cov","rank",  "propagate_nans","json","polars-io"] }
ml_backend = { package = "bento_queries", path = "../../bento_queries", optional = true }
wrds_io = {package = "words_db", path = "../../words_db", optional = true}
pyo3-polars = "0.25.0"
pyo3 = "0.26"
serde_json = "1.0.143"
dioxus-cli-config = { version = "0.6.0", optional = true }
ndarray = "0.16"
ort = { version = "2.0.0-rc.10", features = ["ndarray", "cuda"], optional = true }
ort-candle = { version = "0.1.0+0.8", optional = true }
chrono = "0.4.42"
#duckdb = { version = "1.4.1", optional = true }


[features]
default = ["server"]
web = ["dioxus/web"]
server = [
    "dioxus/server",
    "dep:surrealdb",
    "dep:ml_backend",
    "dep:axum",
    "dep:tokio",
    "dep:dioxus-cli-config",
    "dep:ort",
    "dep:ort-candle",
    "dep:tower-http",
    "dep:wrds_io",
    "wrds_io/server",
    #"dep:duckdb",
]

desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["server"]
